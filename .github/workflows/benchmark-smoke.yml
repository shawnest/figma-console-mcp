name: Benchmark smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Report-only for timing and memory: this step has only deterministic
      # correctness/lifecycle gates. Thresholds can be added after runner
      # variance has been observed in the uploaded results.
      - name: Run deterministic benchmark smoke suite
        run: npm run benchmark:smoke

      - name: Upload benchmark JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke-results-${{ github.run_id }}
          path: benchmarks/results/**/*.json
          if-no-files-found: warn
          retention-days: 14
